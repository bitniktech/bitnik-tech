# Cloudflare Pages project "bitnik-tech" (bitnik.tech). Deployed by .github/workflows/deploy.yml.
# This file is the project's configuration: bindings set in the dashboard are replaced by what is here.
name = "bitnik-tech"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"

# The contact form (functions/api/contact.js) sends through the form-mailer Worker.
[[services]]
binding = "FORM_MAILER"
service = "form-mailer"
